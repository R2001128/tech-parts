<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tech-Parts</title>
<style>
:root{--bg:#f3f7ff;--card:#fff;--ink:#0b1b33;--mute:#5b6b85;--b1:#0b3d91;--b2:#1f6feb;--on:#fff;--line:#d3e0f5;--tint:#e4eeff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1220;--card:#111c30;--ink:#e8f0ff;--mute:#9fb0cc;--b1:#8bb8ff;--b2:#3b82f6;--line:#233553;--tint:#17263f}}
:root[data-theme="dark"]{--bg:#0a1220;--card:#111c30;--ink:#e8f0ff;--mute:#9fb0cc;--b1:#8bb8ff;--b2:#3b82f6;--line:#233553;--tint:#17263f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--card);border-bottom:1px solid var(--line);padding:10px 14px}
.top{display:flex;align-items:center;justify-content:space-between;max-width:760px;margin:auto}
.logo{font-size:22px;font-weight:800;color:var(--b1);border:0;background:none;padding:0;cursor:pointer}
.cartb{position:relative;border:1px solid var(--line);background:var(--tint);color:var(--b1);border-radius:10px;min-height:44px;padding:0 14px;font-weight:600;cursor:pointer}
#cnt{background:var(--b2);color:var(--on);border-radius:99px;padding:1px 7px;margin-left:6px;font-size:12px}
#bar{max-width:760px;margin:10px auto 0}
#q{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;background:var(--bg);color:var(--ink)}
.seg{display:flex;gap:8px;margin:10px 0}
.seg button{flex:1;min-height:44px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;cursor:pointer}
.seg button.on{background:var(--b2);border-color:var(--b2);color:var(--on);font-weight:600}
.sel{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sel select{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;padding:0 8px;width:100%}
main{max-width:760px;margin:auto;padding:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left;font:inherit;color:var(--ink);cursor:pointer}
.art{background:#fff;border:1px solid var(--line);border-radius:10px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;padding:6%;overflow:hidden}
.art img{width:100%;height:100%;object-fit:contain}
.sub{color:var(--mute);font-size:12px;margin-top:2px}
.est{font-size:11px;font-weight:400;color:var(--mute)}
.note{background:var(--tint);border-radius:10px;padding:10px 12px;margin:12px 0;font-size:13px;color:var(--mute)}
.art svg{width:100%;height:100%}
.art.big{max-width:320px;margin:10px auto}
.art.sm{width:76px;flex:none;padding:4%}
.nm{margin-top:8px;font-weight:600;font-size:14px}
.pr{color:var(--b1);font-weight:800;margin-top:2px}
.pr.big{font-size:24px;text-align:center}
.mute{color:var(--mute);margin:0 0 10px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:18px;color:var(--mute)}
.btn{min-height:48px;border:0;border-radius:12px;background:var(--b2);color:var(--on);font:inherit;font-weight:700;padding:0 18px;cursor:pointer}
.btn.ghost{background:var(--tint);color:var(--b1)}
.wide{display:block;width:100%;margin-top:14px}
.link{border:0;background:none;color:var(--b1);font:inherit;min-height:44px;padding:0 4px;cursor:pointer}
h1{font-size:20px;margin:6px 0}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0}
dt{color:var(--mute)}dd{margin:0}
.row{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.grow{flex:1}
.qty{display:flex;align-items:center;gap:8px;margin-top:4px}
.qty button:not(.link){width:44px;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:18px;cursor:pointer}
.tot{display:flex;justify-content:space-between;font-size:18px;padding:12px 4px}
label{display:block;margin-top:12px;font-weight:600}
input.f,select.f{width:100%;min-height:46px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;background:var(--card);color:var(--ink);margin-top:4px}
.err{color:#c0392b;margin-top:10px;min-height:20px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--b1);color:var(--bg);padding:10px 16px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.on{opacity:1}
small{display:block;text-align:center;color:var(--mute);margin:22px 0 8px}
</style></head>
<body>
<header>
<div class="top"><button class="logo" data-a="home">Tech-Parts</button><button class="cartb" data-a="cart">Carrito<span id="cnt">0</span></button></div>
<div id="bar">
<input id="q" type="search" placeholder="Buscar pieza, modelo o marca" aria-label="Buscar">
<details><summary class="link" style="margin-top:6px">Filtros</summary>
<div class="seg" id="brand"><button data-a="brand" data-v="">Todas</button><button data-a="brand" data-v="Lenovo">Lenovo</button><button data-a="brand" data-v="HP">HP</button><button data-a="brand" data-v="Dell">Dell</button></div>
<div class="sel"><select id="tipo" aria-label="Tipo de pieza"></select><select id="modelo" aria-label="Modelo de laptop"></select><select id="max" aria-label="Precio máximo"><option value="0">Cualquier precio</option><option value="30">Hasta $30</option><option value="60">Hasta $60</option><option value="100">Hasta $100</option></select><button class="btn ghost" data-a="clear">Limpiar filtros</button></div>
</details></div>
</header>
<main id="main"></main>
<div id="toast" role="status"></div>

const P=raw.map((r,i)=>({id:i+1,tipo:r[0],name:r[1],desc:r[2],ref:r[3],comp:r[4],lo:r[5],hi:r[6],brand:r[7],model:r[8],img:r[9],full:r[10],price:r[5]}));
const rng=p=>`$${p.lo}`;
let S={q:'',brand:'',tipo:'',model:'',max:0,n:12,v:'cat',id:0,y:0,order:'',err:''},cart={};
try{cart=JSON.parse(localStorage.getItem('tp2')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('tp2',JSON.stringify(cart))}catch(e){}};
const P1=id=>P.find(x=>x.id==id);
const opts=(k,all)=>`<option value="">${all}</option>`+[...new Set(P.map(p=>p[k]))].sort().map(v=>`<option>${v}</option>`).join('');
$('#tipo').innerHTML=opts('tipo','Todas las piezas');$('#modelo').innerHTML=opts('model','Todos los modelos');
const list=()=>P.filter(p=>(!S.brand||p.brand==S.brand)&&(!S.tipo||p.tipo==S.tipo)&&(!S.model||p.model==S.model)&&(!S.max||p.lo<=S.max)&&(!S.q||n(p.name+' '+p.model+' '+p.brand+' '+p.ref).includes(n(S.q))));
const card=p=>`<button class="card" data-go="${p.id}"><div class="art">${art(p)}</div><div class="nm">${p.name}</div><div class="sub">${p.model}</div><div class="pr">${rng(p)}</div></button>`;
function vCat(){const l=list();return `<p class="mute">${l.length} productos</p>`+(l.length?`<div class="grid">${l.slice(0,S.n).map(card).join('')}</div>`+(l.length>S.n?'<button class="btn ghost wide" data-a="more">Ver más</button>':''):'<p class="empty">No hay piezas con esos filtros. Quita alguno o busca otra palabra.</p>')+'<small>Precios referenciales en USD · confirma el número de parte con el serial de tu equipo</small>'}
function vDet(){const p=P1(S.id),chk=/verificar|\?/i.test(p.ref+p.comp);return `<button class="link" data-a="back">‹ Volver al catálogo</button><div class="art big">${art(p)}</div><h1>${p.name}</h1><div class="pr big">${rng(p)}</div><p class="mute" style="text-align:center">Precio en USD</p><dl><dt>Marca</dt><dd>${p.brand}</dd><dt>Laptop</dt><dd>${p.full}</dd><dt>Tipo</dt><dd>${p.tipo}</dd><dt>Modelo / N.° de parte</dt><dd>${p.ref}</dd><dt>Compatibilidad</dt><dd>${p.comp}</dd></dl><p>${p.desc}</p>${chk?'<div class="note">Esta pieza tiene una referencia aproximada: confírmala con el proveedor antes de comprar.</div>':''}<div class="note">Confirma el número exacto con el serial o Service Tag del equipo. Los precios son referenciales y varían según proveedor, stock, IVA (15 %) y envío.</div><button class="btn wide" data-a="add" data-v="${p.id}">Agregar al carrito</button>`}
const total=()=>Object.keys(cart).reduce((t,i)=>t+P1(i).price*cart[i],0);
function vCart(){const ids=Object.keys(cart);if(!ids.length)return '<h1>Carrito</h1><p class="empty">Tu carrito está vacío.</p><button class="btn wide" data-a="home">Ver piezas</button>';return '<h1>Carrito</h1>'+ids.map(i=>{const p=P1(i);return `<div class="row"><div class="art sm">${art(p)}</div><div class="grow"><div class="nm">${p.name}</div><div class="sub">${p.model}</div><div class="pr">${m(p.price)}</div><div class="qty"><button data-a="dec" data-v="${i}" aria-label="Quitar uno">−</button><span>${cart[i]}</span><button data-a="inc" data-v="${i}" aria-label="Agregar uno">+</button><button class="link" data-a="del" data-v="${i}">Eliminar</button></div></div></div>`}).join('')+`<div class="tot"><span>Total</span><b>${m(total())}</b></div><button class="btn wide" data-a="buy">Comprar</button>`}
const vBuy=()=>`<button class="link" data-a="cart">‹ Volver al carrito</button><h1>Datos de entrega</h1><label>Nombre<input class="f" id="nm1" autocomplete="name"></label><label>Teléfono<input class="f" id="tel" type="tel" autocomplete="tel"></label><label>Dirección<input class="f" id="dir" autocomplete="street-address"></label><label>Pago<select class="f" id="pay"><option>Contra entrega</option><option>Transferencia</option></select></label><div class="err" id="err">${S.err}</div><div class="tot"><span>Total</span><b>${m(total())}</b></div><button class="btn wide" data-a="ok">Confirmar pedido</button>`;
const vDone=()=>`<h1>Pedido confirmado</h1><p class="empty">Tu número de pedido es <b>${S.order}</b>. Te contactaremos para coordinar la entrega.</p><button class="btn wide" data-a="home">Seguir comprando</button>`;
function render(){$('#cnt').textContent=Object.values(cart).reduce((a,b)=>a+b,0);$('#bar').hidden=S.v!='cat';$('#main').innerHTML=({cat:vCat,det:vDet,cart:vCart,buy:vBuy,done:vDone})[S.v]();document.querySelectorAll('#brand button').forEach(b=>b.classList.toggle('on',b.dataset.v==S.brand))}
const go=(v,y)=>{S.v=v;render();scrollTo(0,y||0)};
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1600)};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a],[data-go]');if(!b)return;if(b.dataset.go){S.y=scrollY;S.id=b.dataset.go;return go('det')}const a=b.dataset.a,v=b.dataset.v,p=P1(v);
if(a=='home'){S.v='cat';return go('cat')}
if(a=='back')return go('cat',S.y);
if(a=='cart')return go('cart');
if(a=='more'){S.n+=12;return render()}
if(a=='brand'){S.brand=v;S.n=12;return render()}
if(a=='clear'){S.q=S.brand=S.tipo=S.model='';S.max=0;S.n=12;$('#q').value='';$('#tipo').value='';$('#modelo').value='';$('#max').value='0';return render()}
if(a=='add'){cart[v]=Math.min((cart[v]||0)+1,10);save();render();return toast('Agregado al carrito')}
if(a=='inc'){cart[v]=Math.min(cart[v]+1,10);save();return go('cart')}
if(a=='dec'){cart[v]>1?cart[v]--:delete cart[v];save();return go('cart')}
if(a=='del'){delete cart[v];save();return go('cart')}
if(a=='buy'){S.err='';return go('buy')}
if(a=='ok'){if(!$('#nm1').value.trim()||!$('#tel').value.trim()||!$('#dir').value.trim()){$('#err').textContent='Completa nombre, teléfono y dirección para continuar.';return}S.order='TP-'+(1000+Math.floor(Math.random()*9000));cart={};save();go('done')}});
$('#q').addEventListener('input',e=>{S.q=e.target.value;S.n=12;render()});
[['tipo','tipo'],['modelo','model'],['max','max']].forEach(([id,k])=>$('#'+id).addEventListener('change',e=>{S[k]=k=='max'?+e.target.value:e.target.value;S.n=12;render()}));
render();
</script></body></html>
